name: Setup Android SDK and NDK
description: Configure Java 17, Android SDK 36, Build-Tools 36.0.0, and NDK 28.2.13676358.

runs:
  using: composite
  steps:
    - uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: "17"
    - name: 准备 Android SDK / NDK
      shell: bash
      run: |
        SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
        echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
        echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
        SDKM="$SDK/cmdline-tools/latest/bin/sdkmanager"
        yes | "$SDKM" --licenses > /dev/null 2>&1 || true
        "$SDKM" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"
        NDK="$SDK/ndk/28.2.13676358"
        echo "NDK_HOME=$NDK" >> "$GITHUB_ENV"
        LLVM="$NDK/toolchains/llvm/prebuilt/linux-x86_64"
        if [ -d "$LLVM/lib64" ] && ls "$LLVM/lib64"/libclang.so* >/dev/null 2>&1; then
          echo "LIBCLANG_PATH=$LLVM/lib64" >> "$GITHUB_ENV"
        elif [ -d "$LLVM/lib" ] && ls "$LLVM/lib"/libclang.so* >/dev/null 2>&1; then
          echo "LIBCLANG_PATH=$LLVM/lib" >> "$GITHUB_ENV"
        fi
        SYSROOT="$LLVM/sysroot"
        echo "BINDGEN_EXTRA_CLANG_ARGS_aarch64_linux_android=--sysroot=$SYSROOT --target=aarch64-linux-android24" >> "$GITHUB_ENV"
        echo "BINDGEN_EXTRA_CLANG_ARGS_armv7_linux_androideabi=--sysroot=$SYSROOT --target=armv7a-linux-androideabi24" >> "$GITHUB_ENV"
        echo "BINDGEN_EXTRA_CLANG_ARGS_x86_64_linux_android=--sysroot=$SYSROOT --target=x86_64-linux-android24" >> "$GITHUB_ENV"
        ls "$SDK/ndk"
